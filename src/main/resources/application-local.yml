# Local development profile with H2 in-memory database
# Use this when MySQL is not available

spring:
  datasource:
    url: jdbc:h2:mem:webscraper;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

logging:
  level:
    com.browzwi.webscraper: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

webscraper:
  storage:
    root: ./data
  security:
    admin:
      username: admin
      plain-password: admin
  fetcher:
    playwright:
      browser: chromium
      headless: true
      timeout: 20000
