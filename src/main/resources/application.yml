spring:
  application:
    name: webscraper
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  sql:
    init:
      mode: never

logging:
  level:
    com.browzwi.webscraper: INFO

webscraper:
  storage:
    root: ./data
