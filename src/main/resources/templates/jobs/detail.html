<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::main})">
<main>
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-semibold" th:text="${job.name}"></h1>
            <p class="text-slate-500">Recipe: <span th:text="${job.recipe.name}"></span></p>
        </div>
        <a href="/jobs" class="text-sm text-indigo-600">Back to list</a>
    </div>

    <section class="grid md:grid-cols-3 gap-4 mb-8">
        <div class="bg-white rounded-xl shadow p-4">
            <p class="text-xs text-slate-500 uppercase">Status</p>
            <p class="text-lg font-semibold" th:text="${job.status}"></p>
        </div>
        <div class="bg-white rounded-xl shadow p-4">
            <p class="text-xs text-slate-500 uppercase">Schedule</p>
            <p class="text-lg font-semibold" th:text="${job.scheduleCron} ?: 'One shot'"></p>
        </div>
        <div class="bg-white rounded-xl shadow p-4">
            <p class="text-xs text-slate-500 uppercase">Requested By</p>
            <p class="text-lg font-semibold" th:text="${job.requestedBy}"></p>
        </div>
    </section>

    <div class="bg-white rounded-xl shadow">
        <table class="min-w-full divide-y divide-slate-200">
            <thead class="bg-slate-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">URL</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Started</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Finished</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Error</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-slate-100">
            <tr th:each="target : ${targets}">
                <td class="px-6 py-4 text-sm font-medium text-slate-900" th:text="${target.url}"></td>
                <td class="px-6 py-4 text-sm" th:text="${target.status}"></td>
                <td class="px-6 py-4 text-sm text-slate-500" th:text="${target.startedAt}"></td>
                <td class="px-6 py-4 text-sm text-slate-500" th:text="${target.finishedAt}"></td>
                <td class="px-6 py-4 text-sm text-rose-600" th:text="${target.errorMessage}"></td>
                <td class="px-6 py-4 text-right">
                    <button class="text-indigo-600 text-sm"
                            th:attr="hx-get=@{'/jobs/' + ${job.id} + '/targets/' + ${target.id}},
                                     hx-target='#targetDetails',
                                     hx-swap='innerHTML'">View</button>
                </td>
            </tr>
            <tr th:if="${targets.isEmpty()}">
                <td colspan="6" class="px-6 py-4 text-center text-slate-500">No targets yet.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <section class="mt-8 bg-white rounded-xl shadow p-6">
        <h2 class="text-xl font-semibold mb-3">Target Details</h2>
        <div id="targetDetails" class="text-sm text-slate-600">
            <p>Select a target to view results.</p>
        </div>
    </section>
</main>
</html>
