<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal">
    <div class="fixed inset-0 z-50 flex items-center justify-center">
        <button type="button"
                class="absolute inset-0 bg-black/70"
                th:attr="hx-get=${closeUrl}, hx-target='#progress-modal-host', hx-swap='innerHTML'"
                aria-label="Close progress modal">
        </button>
        <div class="relative z-10 w-full max-w-3xl mx-auto px-4">
            <div class="relative bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl overflow-hidden">
                <div class="flex items-center justify-between border-b border-zinc-800 px-6 py-4">
                    <div>
                        <h2 class="text-white font-bold text-lg flex items-center gap-2">
                            <span class="material-symbols-outlined">timeline</span>
                            <span>Scrape Progress</span>
                        </h2>
                        <p class="text-xs text-zinc-500" th:text="${progress.url}"></p>
                    </div>
                    <button type="button"
                            class="text-zinc-400 hover:text-white"
                            th:attr="hx-get=${closeUrl}, hx-target='#progress-modal-host', hx-swap='innerHTML'"
                            aria-label="Close progress modal">
                        <span class="material-symbols-outlined text-xl">close</span>
                    </button>
                </div>
                <div class="px-6 py-5">
                    <div th:replace="~{jobs/target-progress :: content}"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:fragment="empty"></div>
</body>
</html>
