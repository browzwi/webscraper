<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<main class="flex flex-col items-center justify-center min-h-[60vh] space-y-6">
    <div class="text-center">
        <span class="material-symbols-outlined text-9xl text-red-500 mb-4 block">error</span>
        <p class="text-xs uppercase tracking-wide text-red-500 font-semibold mb-2">Something went wrong</p>
        <h1 class="text-4xl font-black text-white mb-3" th:text="${error} ?: 'Internal Server Error'">Error</h1>
        <p class="text-base text-zinc-400 max-w-md" th:text="${message} ?: 'An unexpected error occurred. Please try again later.'"></p>
    </div>

    <div class="card max-w-3xl w-full">
        <h2 class="text-white text-lg font-bold mb-4 flex items-center gap-2">
            <span class="material-symbols-outlined">bug_report</span>
            Error Details
        </h2>
        <dl class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
            <div class="flex flex-col gap-1">
                <dt class="text-zinc-400 font-medium uppercase text-xs">Status</dt>
                <dd class="text-white text-2xl font-bold" th:text="${status}">500</dd>
            </div>
            <div class="flex flex-col gap-1">
                <dt class="text-zinc-400 font-medium uppercase text-xs">Timestamp</dt>
                <dd class="text-white font-mono text-sm" th:text="${timestamp}">2024-01-01 12:00:00</dd>
            </div>
            <div class="flex flex-col gap-1 sm:col-span-2">
                <dt class="text-zinc-400 font-medium uppercase text-xs">Request Path</dt>
                <dd class="text-white font-mono text-xs break-all" th:text="${path}">/path/to/resource</dd>
            </div>
            <div class="flex flex-col gap-1 sm:col-span-2" th:if="${trace}">
                <dt class="text-zinc-400 font-medium uppercase text-xs">Stack Trace</dt>
                <dd class="text-white/70 font-mono text-xs bg-black/30 p-3 rounded-lg overflow-auto max-h-48 scrollbar-dark" th:text="${trace}"></dd>
            </div>
        </dl>
    </div>

    <div class="flex gap-3">
        <a th:href="@{/dashboard}" class="btn btn-primary">
            <span class="material-symbols-outlined">home</span>
            <span>Go to Dashboard</span>
        </a>
        <button onclick="window.history.back()" class="btn btn-secondary">
            <span class="material-symbols-outlined">arrow_back</span>
            <span>Go Back</span>
        </button>
    </div>
</main>
</html>
