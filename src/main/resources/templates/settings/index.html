<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<main>
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-semibold">Settings</h1>
            <p class="text-slate-500">Tune global behaviour for every scrape job.</p>
        </div>
    </div>

    <div th:if="${message}" class="mb-4 bg-emerald-50 text-emerald-800 px-4 py-2 rounded-lg" th:text="${message}"></div>

    <section class="bg-white rounded-2xl shadow p-6">
        <form th:object="${settings}" method="post" class="space-y-6">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <fieldset class="space-y-3">
                <legend class="text-sm font-semibold text-slate-700">Preferred scraper engine</legend>
                <p class="text-xs text-slate-500">Choose HtmlUnit for Java-only footprints or Playwright for modern, JS-heavy experiences.</p>
                <div class="grid md:grid-cols-2 gap-4" th:each="option : ${options}">
                    <label class="flex items-start space-x-3 border border-slate-200 rounded-xl p-4 hover:border-indigo-200 cursor-pointer">
                        <input type="radio" th:field="*{fetcherType}" th:value="${option}" class="mt-1">
                        <div>
                            <p class="text-sm font-semibold text-slate-800" th:text="${option}"></p>
                            <p class="text-xs text-slate-500" th:text="${option.name() == 'HTMLUNIT'} ? 'Fast, headless browsing using HtmlUnit' : 'JS-capable Playwright stub (beta)'"></p>
                        </div>
                    </label>
                </div>
            </fieldset>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">Save Changes</button>
        </form>
    </section>
</main>
</html>
