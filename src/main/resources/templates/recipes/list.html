<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::main})">
<main>
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-semibold">Recipes</h1>
            <p class="text-slate-500">Manage YAML-based scraping recipes and validate them quickly.</p>
        </div>
        <a class="px-4 py-2 bg-indigo-600 text-white rounded-lg" href="/recipes/new">New Recipe</a>
    </div>

    <div th:if="${message}" class="mb-4 bg-emerald-50 text-emerald-800 px-4 py-2 rounded-lg" th:text="${message}"></div>
    <div th:if="${error}" class="mb-4 bg-rose-50 text-rose-800 px-4 py-2 rounded-lg" th:text="${error}"></div>

    <div class="bg-white rounded-xl shadow">
        <table class="min-w-full divide-y divide-slate-200">
            <thead class="bg-slate-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Name</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Key</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Enabled</th>
                <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Actions</th>
            </tr>
            </thead>
            <tbody class="bg-white divide-y divide-slate-100">
            <tr th:each="recipe : ${recipes}">
                <td class="px-6 py-4 text-sm font-medium text-slate-900" th:text="${recipe.name}"></td>
                <td class="px-6 py-4 text-sm text-slate-600" th:text="${recipe.key}"></td>
                <td class="px-6 py-4 text-sm">
                    <span th:text="${recipe.enabled} ? 'Enabled' : 'Disabled'" class="px-2 py-1 rounded-full text-xs"
                          th:classappend="${recipe.enabled} ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-600'"></span>
                </td>
                <td class="px-6 py-4 text-right space-x-2">
                    <a th:href="@{'/recipes/' + ${recipe.id}}" class="text-indigo-600 text-sm">Edit</a>
                </td>
            </tr>
            <tr th:if="${recipes.isEmpty()}">
                <td colspan="4" class="px-6 py-4 text-center text-slate-500">No recipes available yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</html>
