<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<th:block th:replace="~{fragments/head :: common-head(${pageTitle})}"></th:block>
<body class="bg-background-dark min-h-screen font-display">
<div class="relative flex min-h-screen w-full flex-col">
    <!-- Header -->
    <header class="sticky top-0 z-10 flex items-center justify-center border-b border-solid border-white/10 bg-background-dark/80 px-4 py-3 backdrop-blur-md sm:px-6 md:px-8">
        <div class="flex w-full max-w-7xl items-center justify-between">
            <div class="flex items-center gap-4 text-white">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-2xl">data_object</span>
                    <h2 class="text-white text-lg font-bold">Web Scraper</h2>
                </div>
            </div>
            <nav class="hidden items-center gap-8 md:flex" th:with="uri=${requestURI ?: ''}">
                <a class="nav-link nav-link-inactive" th:classappend="${#strings.contains(uri, '/dashboard')} ? 'nav-link-active' : ''" th:href="@{/dashboard}">Dashboard</a>
                <a class="nav-link nav-link-inactive" th:classappend="${#strings.contains(uri, '/recipes')} ? 'nav-link-active' : ''" th:href="@{/recipes}">Recipes</a>
                <a class="nav-link nav-link-inactive" th:classappend="${#strings.contains(uri, '/jobs')} ? 'nav-link-active' : ''" th:href="@{/jobs}">Jobs</a>
                <a class="nav-link nav-link-inactive" th:classappend="${#strings.contains(uri, '/settings')} ? 'nav-link-active' : ''" th:href="@{/settings}">Settings</a>
                <form action="/logout" method="post" class="inline">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <button class="nav-link nav-link-inactive" type="submit">Logout</button>
                </form>
            </nav>
            <button class="md:hidden">
                <span class="material-symbols-outlined text-white">menu</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex flex-1 justify-center bg-background-dark p-4 sm:p-6 md:p-8">
        <div class="w-full max-w-7xl">
            <div th:insert="${content}"></div>
        </div>
    </main>
</div>

<!-- Loading Indicator -->
<div class="htmx-indicator fixed top-6 right-6 bg-zinc-900 border border-zinc-700 text-white text-sm px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 z-50">
    <span class="inline-flex w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
    <span>Working...</span>
</div>

<!-- Scripts -->
<script th:inline="javascript">
    // CSRF Token Setup
    const csrfToken = /*[[${_csrf != null ? _csrf.token : ''}]]*/ '';
    const csrfHeader = /*[[${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}]]*/ 'X-CSRF-TOKEN';
    if (csrfToken) {
        window.csrfToken = csrfToken;
        window.csrfHeaderName = csrfHeader;
    }
    document.body.addEventListener('htmx:configRequest', function (event) {
        if (csrfToken) {
            event.detail.headers[csrfHeader] = csrfToken;
        }
    });

    // Utility function for temporary button text
    function notify(button, tempText) {
        const original = button.textContent;
        button.textContent = tempText;
        setTimeout(() => button.textContent = original, 1200);
    }

    // Copy YAML to clipboard
    window.copyYaml = function (button) {
        const yaml = button.getAttribute('data-yaml');
        navigator.clipboard.writeText(yaml).then(() => {
            notify(button, 'Copied!');
        });
    };

    // Insert YAML into form field
    window.insertYaml = function (button) {
        const yamlField = document.querySelector('[name="yamlContent"]');
        if (yamlField) {
            yamlField.value = button.getAttribute('data-yaml');
            yamlField.dispatchEvent(new Event('input'));
            notify(button, 'Inserted!');
        }
    };

    // Copy text from element
    window.copyFromElement = function (button, selector) {
        const el = document.querySelector(selector);
        if (el) {
            navigator.clipboard.writeText(el.textContent || '').then(() => {
                notify(button, 'Copied!');
            });
        }
    };

    window.buildBeautifyPayload = function (button) {
        const dataset = button ? button.dataset : null;
        const selector = dataset ? dataset.copyTarget : null;
        const targetId = dataset && dataset.targetId ? dataset.targetId : '';
        const element = selector ? document.querySelector(selector) : null;
        return {
            html: element ? (element.textContent || '') : '',
            targetId
        };
    };

    // Copy text content
    window.copyText = function (button, text) {
        navigator.clipboard.writeText(text).then(() => {
            notify(button, 'Copied!');
        });
    };

    function toggleModal(modalId, action) {
        const modal = document.getElementById(modalId);
        if (!modal || !modal.hasAttribute('data-modal-root')) {
            return;
        }
        const shouldOpen = action === 'open';
        modal.classList.toggle('hidden', !shouldOpen);
        modal.setAttribute('aria-hidden', shouldOpen ? 'false' : 'true');
    }

    window.toggleModal = toggleModal;

    window.showProgressModal = function () {
        const container = document.getElementById('progressModalContent');
        if (container) {
            container.innerHTML = '<div class="px-6 py-10 text-center text-zinc-400">'
                + '<span class="material-symbols-outlined text-4xl">hourglass_empty</span>'
                + '<p class="mt-3 text-sm">Fetching the latest progress updates…</p>'
                + '</div>';
        }
        toggleModal('progressModal', 'open');
    };

    window.toggleModal = toggleModal;

    document.addEventListener('click', (event) => {
        const trigger = event.target.closest('[data-modal-action]');
        if (!trigger) {
            return;
        }
        const modalId = trigger.getAttribute('data-modal-target');
        const action = trigger.getAttribute('data-modal-action');
        if (!modalId || !action) {
            return;
        }
        event.preventDefault();
        toggleModal(modalId, action);
    });

    document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') {
            return;
        }
        document.querySelectorAll('[data-modal-root][aria-hidden="false"]').forEach(modal => {
            toggleModal(modal.id, 'close');
        });
    });

    function bindTabButtons(scope) {
        const root = scope && typeof scope.querySelectorAll === 'function' ? scope : document;
        root.querySelectorAll('[data-tab-target]').forEach(button => {
            if (button.dataset.tabBound === 'true') {
                return;
            }
            button.dataset.tabBound = 'true';
            button.addEventListener('click', (event) => {
                event.preventDefault();
                const group = button.closest('[data-tab-group]');
                if (!group) {
                    return;
                }
                const targetId = button.dataset.tabTarget;
                if (!targetId) {
                    return;
                }
                group.querySelectorAll('[data-tab-target]').forEach(btn => btn.setAttribute('data-active', 'false'));
                button.setAttribute('data-active', 'true');
                group.querySelectorAll('.tab-content').forEach(panel => {
                    panel.classList.add('hidden');
                    panel.classList.remove('active');
                });
                const target = group.querySelector(`#${targetId}`);
                if (target) {
                    target.classList.remove('hidden');
                    target.classList.add('active');
                }
            });
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        bindTabButtons();
    });

    document.body.addEventListener('htmx:afterSwap', (event) => {
        const swapped = event.target;
        if (!swapped) {
            return;
        }
        bindTabButtons(swapped);
    });
</script>
</body>
</html>
