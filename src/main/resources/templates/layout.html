<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: 'Web Scraper'"></title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script th:src="@{/webjars/htmx.org/1.9.12/dist/htmx.min.js}"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">
<nav class="bg-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="text-xl font-semibold">Web Scraper</div>
        <div class="space-x-4">
            <a href="/dashboard" class="text-slate-600 hover:text-indigo-600">Dashboard</a>
            <a href="/recipes" class="text-slate-600 hover:text-indigo-600">Recipes</a>
            <a href="/jobs" class="text-slate-600 hover:text-indigo-600">Jobs</a>
            <a href="/settings" class="text-slate-600 hover:text-indigo-600">Settings</a>
            <form action="/logout" method="post" class="inline">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <button class="text-slate-600 hover:text-indigo-600" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>
<main class="max-w-6xl mx-auto px-4 py-8">
    <div th:insert="${content}"></div>
</main>
<script th:inline="javascript">
    const csrfToken = /*[[${_csrf != null ? _csrf.token : ''}]]*/ '';
    document.body.addEventListener('htmx:configRequest', function (event) {
        if (csrfToken) {
            event.detail.headers['X-CSRF-TOKEN'] = csrfToken;
        }
    });

    function notify(button, tempText) {
        const original = button.textContent;
        button.textContent = tempText;
        setTimeout(() => button.textContent = original, 1200);
    }

    window.copyYaml = function (button) {
        const yaml = button.getAttribute('data-yaml');
        navigator.clipboard.writeText(yaml);
        notify(button, 'Copied!');
    };

    window.insertYaml = function (button) {
        const yamlField = document.querySelector('[name="yamlContent"]');
        if (yamlField) {
            yamlField.value = button.getAttribute('data-yaml');
            yamlField.dispatchEvent(new Event('input'));
            notify(button, 'Inserted');
        }
    };

    window.copyFromElement = function (button, selector) {
        const el = document.querySelector(selector);
        if (el) {
            navigator.clipboard.writeText(el.textContent || '');
            notify(button, 'Copied!');
        }
    };
</script>
</body>
</html>
