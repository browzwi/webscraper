<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: 'Web Scraper'"></title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script th:src="@{/webjars/htmx.org/1.9.12/dist/htmx.min.js}"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">
<nav class="bg-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="text-xl font-semibold">Web Scraper</div>
        <div class="space-x-4">
            <a href="/dashboard" class="text-slate-600 hover:text-indigo-600">Dashboard</a>
            <form action="/logout" method="post" class="inline">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <button class="text-slate-600 hover:text-indigo-600" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>
<main class="max-w-6xl mx-auto px-4 py-8">
    <div th:insert="${content}"></div>
</main>
</body>
</html>
