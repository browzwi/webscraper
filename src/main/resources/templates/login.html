<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Web Scraper</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
<div class="bg-white shadow rounded-xl p-8 w-full max-w-md">
    <h1 class="text-2xl font-semibold mb-6 text-center">Sign in</h1>
    <form method="post" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700">Username</label>
            <input class="mt-1 block w-full rounded-md border-slate-300" type="text" name="username" autofocus>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Password</label>
            <input class="mt-1 block w-full rounded-md border-slate-300" type="password" name="password">
        </div>
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <button type="submit" class="w-full bg-indigo-600 text-white rounded-md py-2">Login</button>
    </form>
    <p class="text-xs text-center text-slate-500 mt-4">Use the dev credentials configured in <code>application-dev.yml</code>.</p>
</div>
</body>
</html>
