<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<main th:fragment="resultsFragment">
    <div th:if="${job != null}">
        <div class="card mb-6 bg-zinc-900/50 border border-zinc-800">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <h3 class="text-white text-lg font-bold mb-1">
                        Discovery Results for "<span th:text="${job.keyword}"></span>"
                    </h3>
                    <p class="text-zinc-400 text-sm">
                        Location: <span class="text-zinc-300" th:text="${job.location}"></span>
                        &bull; Source: <span class="text-zinc-300" th:text="${job.discoverySource}"></span>
                        &bull; Found: <span class="text-primary font-bold" th:text="${job.resultsCount}"></span> businesses
                    </p>
                </div>
                <div class="flex items-center gap-3">
                    <a th:href="@{/discovery/{id}/export(id=${job.id})}"
                       class="btn btn-secondary">
                        <span class="material-symbols-outlined text-lg">download</span>
                        <span>Export Excel</span>
                    </a>
                    <a href="/discovery" class="btn btn-ghost">
                        <span class="material-symbols-outlined text-lg">arrow_back</span>
                        <span>New Search</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 class="text-white text-lg font-bold mb-4">Discovered Businesses</h3>

            <div class="overflow-x-auto">
                <table class="table-dark w-full">
                    <thead>
                    <tr>
                        <th class="text-left">Business Name</th>
                        <th class="text-left">Google Search URL</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="business : ${businesses}">
                        <td class="text-white font-medium" th:text="${business.businessName}"></td>
                        <td>
                            <a th:if="${business.targetUrl != null && !business.targetUrl.isEmpty()}"
                               th:href="${business.targetUrl}"
                               target="_blank"
                               class="text-primary hover:text-primary-400 text-sm truncate max-w-2xl block"
                               th:text="${business.targetUrl}"></a>
                            <span th:unless="${business.targetUrl != null && !business.targetUrl.isEmpty()}"
                                  class="text-zinc-500 text-sm">No URL</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(businesses)}" class="text-center py-8">
                <span class="material-symbols-outlined text-4xl text-zinc-600">inbox</span>
                <p class="text-zinc-400 mt-2">No businesses discovered yet.</p>
            </div>
        </div>
    </div>
</main>
</html>
