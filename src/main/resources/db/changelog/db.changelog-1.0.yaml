databaseChangeLog:
  - changeSet:
      id: 001-create-core-tables
      author: codex
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: char(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createTable:
            tableName: scraper_recipes
            columns:
              - column:
                  name: id
                  type: char(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: recipe_key
                  type: varchar(128)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: varchar(512)
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: yaml_content
                  type: longtext
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: created_by
                  type: varchar(64)
        - createTable:
            tableName: scrape_jobs
            columns:
              - column:
                  name: id
                  type: char(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: recipe_id
                  type: char(36)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: schedule_cron
                  type: varchar(64)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: requested_by
                  type: varchar(64)
        - createTable:
            tableName: scrape_targets
            columns:
              - column:
                  name: id
                  type: char(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_id
                  type: char(36)
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: varchar(2048)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: result_path
                  type: varchar(512)
              - column:
                  name: raw_file_name
                  type: varchar(255)
              - column:
                  name: processed_file_name
                  type: varchar(255)
              - column:
                  name: started_at
                  type: timestamp
              - column:
                  name: finished_at
                  type: timestamp
              - column:
                  name: error_message
                  type: varchar(2000)
        - createTable:
            tableName: scrape_result_data
            columns:
              - column:
                  name: id
                  type: char(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: target_id
                  type: char(36)
                  constraints:
                    nullable: false
              - column:
                  name: data_json
                  type: longtext
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: scrape_jobs
            baseColumnNames: recipe_id
            referencedTableName: scraper_recipes
            referencedColumnNames: id
            constraintName: fk_scrape_jobs_recipe
        - addForeignKeyConstraint:
            baseTableName: scrape_targets
            baseColumnNames: job_id
            referencedTableName: scrape_jobs
            referencedColumnNames: id
            constraintName: fk_scrape_targets_job
        - addForeignKeyConstraint:
            baseTableName: scrape_result_data
            baseColumnNames: target_id
            referencedTableName: scrape_targets
            referencedColumnNames: id
            constraintName: fk_scrape_result_target

  - changeSet:
      id: 002-seed-admin
      author: codex
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: id
                  valueComputed: UUID()
              - column:
                  name: username
                  value: admin
              - column:
                  name: password_hash
                  value: $2a$10$D8zaoOfAKL2etwNtyOaIfuknwu8iVLAsBdo6wYVQADKFKOAOxnytm
              - column:
                  name: role
                  value: ROLE_ADMIN
              - column:
                  name: enabled
                  valueBoolean: true
  - changeSet:
      id: 003-add-plain-password
      author: codex
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: plain_password
                  type: varchar(64)
        - update:
            tableName: users
            columns:
              - column:
                  name: plain_password
                  value: admin
            where: username = 'admin'
  - changeSet:
      id: 004-job-options-json
      author: codex
      changes:
        - addColumn:
            tableName: scrape_jobs
            columns:
              - column:
                  name: options_json
                  type: longtext
